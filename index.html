<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ထီလက်မှတ် ပေါက်/မပေါက် စစ်ဆေးရန်</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pyidaungsu','Segoe UI',Tahoma,sans-serif; }
        body {
            background: linear-gradient(135deg,#fff7ed,#f8fafc);
            display:flex; justify-content:center; align-items:center;
            min-height:100vh; margin:0; padding:20px;
        }
        .card {
            background:#fff; width:100%; max-width:500px; padding:26px;
            border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,.10);
        }
        h2 { margin:0 0 6px; text-align:center; color:#b45309; font-size:23px; }
        .subtitle { text-align:center; color:#6b7280; font-size:14px; margin-bottom:22px; }
        label { display:block; font-weight:700; color:#374151; margin-bottom:8px; }
        input {
            width:100%; padding:14px 15px; border:1.5px solid #d1d5db;
            border-radius:10px; font-size:18px; outline:none; text-align:center;
        }
        input:focus { border-color:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.15); }
        .hint { color:#6b7280; font-size:13px; margin:8px 0 16px; text-align:center; }
        button {
            width:100%; background:#d97706; color:white; border:0; padding:13px;
            border-radius:10px; font-size:17px; font-weight:700; cursor:pointer;
        }
        button:hover { background:#b45309; }
        .result { margin-top:18px; padding:16px; border-radius:12px; display:none; line-height:1.7; }
        .win { background:#ecfdf5; color:#166534; border:1px solid #86efac; }
        .lose { background:#fef2f2; color:#991b1b; border:1px solid #fca5a5; }
        .small { font-size:13px; font-weight:400; margin-top:5px; }
        .prize { font-size:20px; }
    </style>
</head>
<body>
<div class="card">
    <h2>ထီလက်မှတ် ပေါက် / မပေါက် စစ်ဆေးရန်</h2>
    <div class="subtitle">ထီလက်မှတ်နံပါတ်ကို တစ်ခါတည်း ရိုက်ထည့်ပါ</div>

    <label for="ticket">ထီလက်မှတ်နံပါတ်</label>
    <input id="ticket" type="text" inputmode="text" maxlength="20"
           placeholder="ဥပမာ - က ၁၂၃၄၅"
           onkeydown="if(event.key==='Enter') checkLottery()">
    <div class="hint">ဥပမာ — က ၁၂၃၄၅ / က-12345 / က12345</div>

    <button onclick="checkLottery()">ပေါက် / မပေါက် စစ်ဆေးမည်</button>
    <div id="resultBox" class="result"></div>
</div>

<script>
    // မြန်မာဂဏန်း ↔ အင်္ဂလိပ်ဂဏန်း ပြောင်းခြင်း
    function normalizeDigits(str) {
        const map = {'၀':'0','၁':'1','၂':'2','၃':'3','၄':'4','၅':'5','၆':'6','၇':'7','၈':'8','၉':'9'};
        return String(str).replace(/[၀-၉]/g, ch => map[ch]);
    }

    // ထီလက်မှတ်ကို "အက္ခရာ + ဂဏန်း" ပုံစံသို့ ပြောင်းခြင်း
    function parseTicket(raw) {
        const text = normalizeDigits(raw)
            .replace(/[\s\-–—_]+/g, '')
            .trim();

        const match = text.match(/^([\u1000-\u109F]+)(\d{5})$/);
        if (!match) return null;

        return {
            prefix: match[1],
            number: match[2]
        };
    }

    /*
      ပုံထဲက ထီပေါက်စဉ်စာရင်း

      matchLength
      5 = အက္ခရာ + ဂဏန်း ၅ လုံး အတိအကျတူရမည်
      3 = အက္ခရာ + ရှေ့ဂဏန်း ၃ လုံးတူရမည်
      2 = အက္ခရာ + ရှေ့ဂဏန်း ၂ လုံးတူရမည်
      1 = အက္ခရာ + ရှေ့ဂဏန်း ၁ လုံးတူရမည်
    */
    const winningData = [
        // ဆုတစ်ဆုချင်း — ကျပ်သိန်း (၅၀၀)
        { prize:"ကျပ်သိန်း (၅၀၀) ဆု", prefix:"န", number:"၅၆၂၂၆", matchLength:5 },

        // ကျပ်သိန်း (၂၀၀)
        { prize:"ကျပ်သိန်း (၂၀၀) ဆု", prefix:"ဘ", number:"၄၂၁၇၃", matchLength:5 },
        { prize:"ကျပ်သိန်း (၂၀၀) ဆု", prefix:"ထ", number:"၅၇၁၉၂", matchLength:5 },

        // ကျပ်သိန်း (၁၀၀)
        { prize:"ကျပ်သိန်း (၁၀၀) ဆု", prefix:"မ", number:"၁၀၄၆၉", matchLength:5 },
        { prize:"ကျပ်သိန်း (၁၀၀) ဆု", prefix:"ဗ", number:"၃၁၃၃၁", matchLength:5 },
        { prize:"ကျပ်သိန်း (၁၀၀) ဆု", prefix:"ပ", number:"၅၂၉၀၅", matchLength:5 },

        // ကျပ်သိန်း (၅၀)
        { prize:"ကျပ်သိန်း (၅၀) ဆု", prefix:"ယ", number:"၆၅၆၆၉", matchLength:5 },
        { prize:"ကျပ်သိန်း (၅၀) ဆု", prefix:"ဝ", number:"၆၅၆၅၃", matchLength:5 },
        { prize:"ကျပ်သိန်း (၅၀) ဆု", prefix:"ယ", number:"၇၇၆၅၉", matchLength:5 },
        { prize:"ကျပ်သိန်း (၅၀) ဆု", prefix:"သ", number:"၈၈၉၇၉", matchLength:5 },

        // ကျပ်သိန်း (၂၀)
        { prize:"ကျပ်သိန်း (၂၀) ဆု", prefix:"တ", number:"၂၃၉၅၅", matchLength:5 },
        { prize:"ကျပ်သိန်း (၂၀) ဆု", prefix:"ယ", number:"၃၁၈၁၆", matchLength:5 },
        { prize:"ကျပ်သိန်း (၂၀) ဆု", prefix:"ပ", number:"၃၄၀၆၇", matchLength:5 },
        { prize:"ကျပ်သိန်း (၂၀) ဆု", prefix:"ဝ", number:"၄၁၁၁၀", matchLength:5 },
        { prize:"ကျပ်သိန်း (၂၀) ဆု", prefix:"င", number:"၆၂၅၁၁", matchLength:5 },

        // ကျပ် (၁၀) သိန်း
        { prize:"ကျပ် (၁၀) သိန်း ဆု", prefix:"ဃ", number:"၆၇၆၆၁", matchLength:5 },
        { prize:"ကျပ် (၁၀) သိန်း ဆု", prefix:"ဂ", number:"၂၅၄၂၆", matchLength:5 },
        { prize:"ကျပ် (၁၀) သိန်း ဆု", prefix:"ဆ", number:"၃၂၅၂၇", matchLength:5 },
        { prize:"ကျပ် (၁၀) သိန်း ဆု", prefix:"ဝ", number:"၆၁၆၁၅", matchLength:5 },
        { prize:"ကျပ် (၁၀) သိန်း ဆု", prefix:"သ", number:"၉၆၄၃၀", matchLength:5 },

        // ဝေဝေဆာဆာပဒေသာ — ကျပ် (၂) သိန်း
        { prize:"ကျပ် (၂) သိန်း ဆု", prefix:"ထ", number:"၁၆၄၉", matchLength:4 },
        { prize:"ကျပ် (၂) သိန်း ဆု", prefix:"ခ", number:"၂၉၁၄", matchLength:4 },
        { prize:"ကျပ် (၂) သိန်း ဆု", prefix:"ည", number:"၄၇၆၃", matchLength:4 },
        { prize:"ကျပ် (၂) သိန်း ဆု", prefix:"ဒ", number:"၅၉၀၁", matchLength:4 },
        { prize:"ကျပ် (၂) သိန်း ဆု", prefix:"ဘ", number:"၆၉၁၄", matchLength:4 },

        // ကျပ် (၁) သိန်း — ရှေ့ ၃ လုံး
        { prize:"ကျပ် (၁) သိန်း ဆု", prefix:"ပ", number:"၂၅၃", matchLength:3 },
        { prize:"ကျပ် (၁) သိန်း ဆု", prefix:"ဝ", number:"၇၁၆", matchLength:3 },
        { prize:"ကျပ် (၁) သိန်း ဆု", prefix:"င", number:"၃၃၁", matchLength:3 },
        { prize:"ကျပ် (၁) သိန်း ဆု", prefix:"င", number:"၃၉၄", matchLength:3 },
        { prize:"ကျပ် (၁) သိန်း ဆု", prefix:"ဗ", number:"၃၉၉", matchLength:3 },

        // ကျပ် (၅) သောင်း — ရှေ့ ၃ လုံး
        { prize:"ကျပ် (၅) သောင်း ဆု", prefix:"ဝ", number:"၄၈၁", matchLength:3 },
        { prize:"ကျပ် (၅) သောင်း ဆု", prefix:"ဝ", number:"၆၃၀", matchLength:3 },
        { prize:"ကျပ် (၅) သောင်း ဆု", prefix:"ရ", number:"၇၅၆", matchLength:3 },
        { prize:"ကျပ် (၅) သောင်း ဆု", prefix:"န", number:"၈၃၂", matchLength:3 },
        { prize:"ကျပ် (၅) သောင်း ဆု", prefix:"အ", number:"၉၂၅", matchLength:3 },
        { prize:"ကျပ် (၅) သောင်း ဆု", prefix:"ဘ", number:"၉၅၂", matchLength:3 },

        // ကျပ် (၁) သောင်း — ရှေ့ ၂ လုံး
        { prize:"ကျပ် (၁) သောင်း ဆု", prefix:"ဝ", number:"၁၆", matchLength:2 },
        { prize:"ကျပ် (၁) သောင်း ဆု", prefix:"ဇ", number:"၁၉", matchLength:2 },
        { prize:"ကျပ် (၁) သောင်း ဆု", prefix:"ဇ", number:"၂၉", matchLength:2 },
        { prize:"ကျပ် (၁) သောင်း ဆု", prefix:"တ", number:"၃၂", matchLength:2 },
        { prize:"ကျပ် (၁) သောင်း ဆု", prefix:"ဒ", number:"၅၅", matchLength:2 },
        { prize:"ကျပ် (၁) သောင်း ဆု", prefix:"ဝ", number:"၉၈", matchLength:2 },
        { prize:"ကျပ် (၁) သောင်း ဆု", prefix:"ပ", number:"၉၉", matchLength:2 }
    ];

    const priority = {5: 4, 3: 3, 2: 2, 1: 1};

    function checkLottery() {
        const raw = document.getElementById("ticket").value;
        const resultBox = document.getElementById("resultBox");
        const ticket = parseTicket(raw);

        if (!ticket || ticket.number.length !== 5) {
            resultBox.style.display = "block";
            resultBox.className = "result lose";
            resultBox.innerHTML = "ထီလက်မှတ်ပုံစံ မှားနေပါတယ်။<div class='small'>ဥပမာ — <strong>က ၁၂၃၄၅</strong> လို့ ရိုက်ထည့်ပါ။</div>";
            return;
        }

        const candidates = winningData.filter(item => {
            if (item.prefix !== ticket.prefix) return false;

            const winNumber = normalizeDigits(item.number);
            return ticket.number.slice(0, item.matchLength) === winNumber.slice(0, item.matchLength);
        }).sort((a,b) => priority[b.matchLength] - priority[a.matchLength]);

        resultBox.style.display = "block";

        if (candidates.length) {
            const win = candidates[0];
            const matchedPart = ticket.prefix + " " + ticket.number.slice(0, win.matchLength);
            resultBox.className = "result win";
            resultBox.innerHTML =
                "🎉 <strong>ဂုဏ်ယူပါတယ်!</strong><br>" +
                "ထီလက်မှတ် <strong>" + ticket.prefix + " " + ticket.number + "</strong> သည်<br>" +
                "<span class='prize'><strong>" + win.prize + "</strong></span> ပေါက်ပါသည်။" +
                "<div class='small'>ကိုက်ညီသည့်အပိုင်း — <strong>" + matchedPart + "</strong></div>";
        } else {
            resultBox.className = "result lose";
            resultBox.innerHTML =
                "😔 ထီလက်မှတ် <strong>" + ticket.prefix + " " + ticket.number +
                "</strong> သည် ဆုမပေါက်ပါ။";
        }
    }
</script>
</body>
</html>
