<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ထီပေါက်စဉ် စစ်ဆေးရန်</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            padding: 25px;
            text-align: center;
        }
        h2 {
            color: #d97706;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        select, input[type="text"] {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        select {
            width: 35%;
            background-color: #fff;
        }
        input[type="text"] {
            width: 65%;
        }
        button {
            width: 100%;
            background-color: #d97706;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #b45309;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
        }
        .win {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }
        .lose {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>(၄၄) ကြိမ်မြောက် 5 Digits ထီပေါက်စဉ်</h2>
    <div class="subtitle">၁၆-၈-၂၀၂၄ (တနင်္ဂနွေနေ့)</div>
    
    <div class="input-group">
        <select id="prefix">
            <option value="က">က</option>
            <option value="ခ">ခ</option>
            <option value="ဂ">ဂ</option>
            <option value="ဃ">ဃ</option>
            <option value="င">င</option>
            <option value="စ">စ</option>
            <option value="ဆ">ဆ</option>
            <option value="ဇ">ဇ</option>
            <option value="ဈ">ဈ</option>
            <option value="ည">ည</option>
            <option value="ဋ">ဋ</option>
            <option value="ဌ">ဌ</option>
            <option value="ဍ">ဍ</option>
            <option value="ဎ">ဎ</option>
            <option value="ဏ">ဏ</option>
            <option value="တ">တ</option>
            <option value="ထ">ထ</option>
            <option value="ဒ">ဒ</option>
            <option value="ဓ">ဓ</option>
            <option value="န">န</option>
            <option value="ပ">ပ</option>
            <option value="ဖ">ဖ</option>
            <option value="ဗ">ဗ</option>
            <option value="ဘ">ဘ</option>
            <option value="မ">မ</option>
            <option value="ယ">ယ</option>
            <option value="ရ">ရ</option>
            <option value="လ">လ</option>
            <option value="ဝ">ဝ</option>
            <option value="သ">သ</option>
            <option value="ဟ">ဟ</option>
            <option value="ဠ">ဠ</option>
            <option value="အ">အ</option>
        </select>
        <input type="text" id="ticketNumber" placeholder="ထီနံပါတ် (ဥပမာ - ၅၅၅၆၀)" maxlength="5">
    </div>

    <button onclick="checkLottery()">ထီပေါက်စဉ် စစ်ဆေးမည်</button>

    <div id="resultBox" class="result"></div>
</div>

<script>
    // မြန်မာဂဏန်းမှ အင်္ဂလိပ်ဂဏန်းသို့ ပြောင်းလဲရန်
    function convertBurmeseToEnglishNums(str) {
        const burmeseDigits = ['၀', '၁', '၂', '၃', '၄', '၅', '၆', '၇', '၈', '၉'];
        return str.replace(/[၀-၉]/g, function(w) {
            return burmeseDigits.indexOf(w);
        });
    }

    // ပုံပါ ထီပေါက်စဉ် ဒေတာများ (အက္ခရာ + နံပါတ်)
    const winningData = [
        // ဆုတစ်ဆုချင်း
        { prize: "ကျပ်သိန်း(၅၀၀) ဆု", prefix: "ည", number: "၅၅၅၆၀" },
        { prize: "ကျပ်သိန်း(၂၀၀) ဆု", prefix: "ပ", number: "၄၄၃၃၆" },
        { prize: "ကျပ်သိန်း(၂၀၀) ဆု", prefix: "ဈ", number: "၈၁၂၂၉" },
        { prize: "ကျပ်သိန်း(၁၀၀) ဆု", prefix: "ယ", number: "၉၃၈၈၃" },
        { prize: "ကျပ်သိန်း(၁၀၀) ဆု", prefix: "ရ", number: "၆၆၇၆၃" },
        { prize: "ကျပ်သိန်း(၅၀) ဆု", prefix: "ဇ", number: "၁၂၈၈၄" },
        { prize: "ကျပ်သိန်း(၅၀) ဆု", prefix: "ဒ", number: "၁၅၃၃၈" },
        { prize: "ကျပ်သိန်း(၅၀) ဆု", prefix: "ဆ", number: "၁၈၂၄၁" },
        { prize: "ကျပ်သိန်း(၅၀) ဆု", prefix: "ဂ", number: "၂၄၈၄၉" },
        { prize: "ကျပ်သိန်း(၅၀) ဆု", prefix: "ဒ", number: "၃၄၄၇၃" },
        { prize: "ကျပ်သိန်း(၅၀) ဆု", prefix: "လ", number: "၈၅၃၂၈" },
        { prize: "ကျပ်သိန်း(၂၀) ဆု", prefix: "ဘ", number: "၂၀၁၁၃" },
        { prize: "ကျပ်သိန်း(၂၀) ဆု", prefix: "ဘ", number: "၂၅၁၅၆" },
        { prize: "ကျပ်သိန်း(၂၀) ဆု", prefix: "ယ", number: "၃၆၉၄၅" },
        { prize: "ကျပ်သိန်း(၁၀) ဆု", prefix: "ရ", number: "၂၄၄၆၇" },
        { prize: "ကျပ်သိန်း(၁၀) ဆု", prefix: "ခ", number: "၂၉၀၅၃" },

        // ဝေဝေဆာဆာဆုများ
        { prize: "ကျပ်(၂)သိန်း ဆု", prefix: "ပ", number: "၃၂၇၀၃" },
        { prize: "ကျပ်(၂)သိန်း ဆု", prefix: "ဈ", number: "၅၁၁၀၈" },
        { prize: "ကျပ်(၁)သိန်း ဆု", prefix: "ပ", number: "၅၀၇" }, // ရှေ့ဂဏန်းများအတိုင်း
        { prize: "ကျပ်(၁)သိန်း ဆု", prefix: "ဆ", number: "၆၄၉" },
        { prize: "ကျပ်(၅)သောင်း ဆု", prefix: "ဗ", number: "၁၇" },
        { prize: "ကျပ်(၅)သောင်း ဆု", prefix: "ထ", number: "၂၈" },
        { prize: "ကျပ်(၁)သောင်း ဆု", prefix: "ဇ", number: "၁" },
        { prize: "ကျပ်(၁)သောင်း ဆု", prefix: "က", number: "၂" },
        { prize: "ကျပ်(၁)သောင်း ဆု", prefix: "အ", number: "၄" }
    ];

    function checkLottery() {
        const prefix = document.getElementById("prefix").value;
        let number = document.getElementById("ticketNumber").value.trim();
        const resultBox = document.getElementById("resultBox");

        if (!number) {
            alert("ကျေးဇူးပြု၍ ထီနံပါတ် ရိုက်ထည့်ပါ။");
            return;
        }

        // ဂဏန်းများကို ပုံစံတူအောင် ညှိခြင်း
        const searchKey = prefix + "-" + number;
        let isWon = false;
        let wonPrize = "";

        // ပေါက်မဲ စစ်ဆေးခြင်း
        for (let item of winningData) {
            if (item.prefix === prefix && item.number === number) {
                isWon = true;
                wonPrize = item.prize;
                break;
            }
        }

        resultBox.style.display = "block";
        if (isWon) {
            resultBox.className = "result win";
            resultBox.innerHTML = `ဂုဏ်ယူပါတယ်။ <br> ထီလက်မှတ် <strong>${prefix}-${number}</strong> သည် <strong>${wonPrize}</strong> ပေါက်ပါသည်။`;
        } else {
            resultBox.className = "result lose";
            resultBox.innerHTML = `စိတ်မကောင်းပါ။ <br> ထီလက်မှတ် <strong>${prefix}-${number}</strong> သည် ဆုမဲပေါက်ခြင်း မရှိပါ။`;
        }
    }
</script>

</body>
</html>
